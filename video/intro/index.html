<!doctype html>
<html lang="en" data-composition-variables='[{"id":"primary","type":"color","label":"FamFlix purple","default":"#7c5cff"},{"id":"background","type":"color","label":"Background","default":"#0b0b0f"}]'>
  <head>
    <meta charset="utf-8">
    <title>FamFlix - less choosing, more watching</title>
    <link rel="stylesheet" href="assets/brand.css">
    <script src="assets/gsap.min.js"></script>
    <script src="assets/audio-levels.js"></script>
  </head>
  <body>
    <div data-hf-id="hf-1yge" id="main" data-composition-id="main" data-width="1920" data-height="1080" data-duration="25" data-fps="30">
      <div data-hf-id="hf-662t" id="brandbar" class="brandbar clip" data-start="0" data-duration="25" data-track-index="7">
        <div data-hf-id="hf-cb03" class="wordmark"><img data-hf-id="hf-vpk7" src="assets/icon.svg" alt=""><span data-hf-id="hf-3kk8">FamFlix</span></div>
        <span data-hf-id="hf-tnk4" class="eyebrow">YOUR LIST. YOUR PEOPLE. YOUR NEXT MOVIE NIGHT.</span>
      </div>
      <div data-hf-id="hf-fqa0" id="hook" class="clip" data-composition-id="hook" data-composition-src="scenes/hook.html" data-start="0" data-duration="2.4" data-width="1920" data-height="1080" data-track-index="1" data-track-kind="graphics"></div>
      <div id="personal" class="clip" data-composition-id="personal" data-composition-src="scenes/personal.html" data-start="2.25" data-duration="6.9" data-width="1920" data-height="1080" data-track-index="2" data-track-kind="graphics"></div>
      <div data-hf-id="hf-drb4" id="lists" class="clip" data-composition-id="lists" data-composition-src="scenes/lists.html" data-start="9" data-duration="3.825" data-width="1920" data-height="1080" data-track-index="3" data-track-kind="graphics"></div>
      <div data-hf-id="hf-ze9v" id="night" class="clip" data-composition-id="night" data-composition-src="scenes/night.html" data-start="12.675" data-duration="4.125" data-width="1920" data-height="1080" data-track-index="4" data-track-kind="graphics"></div>
      <div data-hf-id="hf-0q14" id="memories" class="clip" data-composition-id="memories" data-composition-src="scenes/memories.html" data-start="16.65" data-duration="3.6" data-width="1920" data-height="1080" data-track-index="5" data-track-kind="graphics"></div>
      <div data-hf-id="hf-0wxe" id="outro" class="clip" data-composition-id="outro" data-composition-src="scenes/outro.html" data-start="20.1" data-duration="4.9" data-width="1920" data-height="1080" data-track-index="6" data-track-kind="graphics"></div>
      <div data-hf-id="hf-nnyo" id="ambient" class="ambient clip" data-start="0" data-duration="25" data-track-index="8" data-layout-allow-overlap></div>
      <div data-hf-id="hf-6irc" id="footer" class="film-footer clip" data-start="0" data-duration="25" data-track-index="9">
        <span data-hf-id="hf-hl4m">YOUR OWN WATCHLIST. SHARED MOVIE NIGHTS.</span>
        <span data-hf-id="hf-ibvv">Illustrative demo &middot; fictional titles and people</span>
      </div>
      <div data-hf-id="hf-8sj6" id="progress" class="progress clip" data-start="0" data-duration="25" data-track-index="10"><div data-hf-id="hf-c4bu" id="progress-fill"></div></div>
      <audio data-hf-id="hf-x6dn" id="score" class="clip" src="assets/score.wav" data-start="0" data-duration="25" data-track-index="11" data-volume="0.25"></audio>
      <audio id="narration" class="clip" src="assets/narration.wav" data-start="0" data-duration="25" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      const light = document.getElementById("ambient");
      const clock = { time: 0 };
      timeline.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 25, ease: "none" }, 0);
      timeline.fromTo("#brandbar", { opacity: 1 }, { opacity: 0, duration: 0.2625 }, 20.1);
      timeline.to(clock, {
        time: 25, duration: 25, ease: "none",
        onUpdate() {
          const frame = Math.min(749, Math.floor(clock.time * 30));
          light.style.opacity = String(0.11 + window.FAMFLIX_AUDIO_LEVELS[frame] * 0.1);
        }
      }, 0);
      window.__timelines.main = timeline;
    </script>
  </body>
</html>
