<!doctype html>
<html lang="en" data-layout="{{LAYOUT}}">
  <head>
    <meta charset="utf-8">
    <title>{{NAME}} — product introduction</title>
    <link rel="stylesheet" href="assets/generated/project.css">
    <script src="assets/generated/gsap.min.js"></script>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-duration="{{DURATION}}" data-fps="{{FPS}}">
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="scenes/hook.html" data-start="0" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="{{WIDTH}}" data-height="{{HEIGHT}}"></div>
      <div id="flow" class="clip" data-composition-id="flow" data-composition-src="scenes/flow.html" data-start="3" data-duration="{{FLOW_DURATION}}" data-track-index="2" data-track-kind="graphics" data-width="{{WIDTH}}" data-height="{{HEIGHT}}"></div>
      <div id="outro" class="clip" data-composition-id="outro" data-composition-src="scenes/outro.html" data-start="{{OUTRO_START}}" data-duration="4" data-track-index="3" data-track-kind="graphics" data-width="{{WIDTH}}" data-height="{{HEIGHT}}"></div>
      <audio id="score" class="clip" src="assets/generated/score.wav" data-start="0" data-duration="{{DURATION}}" data-volume="{{MUSIC_GAIN}}" data-track-index="4"></audio>
      <audio id="narration" class="clip" src="assets/generated/narration.wav" data-start="0" data-duration="{{DURATION}}" data-volume="1" data-track-index="5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines.main = gsap.timeline({ paused: true }).to({}, { duration: {{DURATION}} }, 0);
    </script>
  </body>
</html>
